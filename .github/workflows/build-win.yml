# بناء .exe واختباره على ويندوز حقيقي — المسار الوحيد المعتمد للتحقق من التغليف (الوثيقة §13)
name: windows-build-verify

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write # لكتابة تقرير الحالة في ci-status/ (الوكيل لا يملك صلاحية قراءة نتائج Actions عبر API)

env:
  APP_STATE_DIR_NAME: RAFD # = productName في electron-builder.yml ⇒ %APPDATA%\RAFD

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (network واقعي مفتوح على الـrunner)
        run: npm ci
        shell: pwsh

      - name: Unit + integration tests (Vitest على ويندوز حقيقي)
        run: npm test
        shell: pwsh

      - name: Typecheck
        run: npm run typecheck
        shell: pwsh

      - name: Build (electron-vite)
        run: npm run build
        shell: pwsh

      - name: Generate fresh test license (مفتاح تجريبي جديد لكل تشغيل)
        id: license
        run: |
          $out = node tools/keygen/sign-license.mjs --customer "CI Test Store"
          $license = ($out | Where-Object { $_ -notmatch '^#' }).Trim()
          if ([string]::IsNullOrWhiteSpace($license)) { throw "license generation failed" }
          "RAFD_TEST_LICENSE=$license" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "license generated (length=$($license.Length))"
        shell: pwsh

      - name: Package Windows NSIS installer
        run: npx electron-builder --win nsis --publish never
        shell: pwsh

      - name: Install silently + تشخيص سبب جذري (دفعة تشخيصية — تحقق فعلي لا تخمين)
        id: install
        run: |
          $ErrorActionPreference = 'Continue'
          $installer = Get-ChildItem dist\*.exe | Select-Object -First 1
          Write-Output "installer=$($installer.FullName) size=$($installer.Length)"

          # س١: كود خروج العملية الأولى للمثبّت (لم يكن مطبوعًا سابقًا)
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Output "installer first-process exit code: $($proc.ExitCode)"

          # س٣: NSIS oneClick قد يعيد إقلاع نفسه بعملية فرعية (فيرجع -Wait مبكرًا) +
          # فحص Defender لملف 109MB غير موقَّع قد يؤخر النسخ — حلقية انتظار 90s كدليل تمييزي.
          $exe = "$env:LOCALAPPDATA\Programs\RAFD\RAFD.exe"
          $pollStart = Get-Date
          $found = $false
          while (((Get-Date) - $pollStart).TotalSeconds -lt 90) {
            if (Test-Path $exe) { $found = $true; break }
            Start-Sleep -Seconds 2
          }
          $elapsed = [math]::Round(((Get-Date) - $pollStart).TotalSeconds, 1)
          Write-Output "exe poll: found=$found elapsed=${elapsed}s window=90s"

          # س٢: ماذا يوجد فعليًا في أماكن التثبيت المحتملة + آثار NSIS + عمليات باقية + Defender
          Write-Output "=== %LOCALAPPDATA%\Programs ==="
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Select-Object Name, LastWriteTime | Format-Table -AutoSize
          Write-Output "=== %LOCALAPPDATA%\Programs\RAFD (recursive) ==="
          Get-ChildItem "$env:LOCALAPPDATA\Programs\RAFD" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
          Write-Output "=== ProgramFiles (machine-level fallback) ==="
          Get-ChildItem "$env:ProgramFiles" -ErrorAction SilentlyContinue | Where-Object Name -match 'RAFD' | Format-Table Name -AutoSize
          Get-ChildItem "${env:ProgramFiles(x86)}" -ErrorAction SilentlyContinue | Where-Object Name -match 'RAFD' | Format-Table Name -AutoSize
          Write-Output "=== NSIS staging dirs in %TEMP% (ns*.tmp) ==="
          Get-ChildItem "$env:TEMP" -Directory -Filter 'ns*.tmp' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 5 Name, LastWriteTime | Format-Table -AutoSize
          Write-Output "=== lingering RAFD/installer processes (قرين H1: عملية فرعية ما زالت تنسخ) ==="
          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'RAFD|nsis|Setup' } | Select-Object Id, Name, Path | Format-Table -AutoSize
          Write-Output "=== Defender Operational events (قرين H2: حظر/عزل المثبّت) ==="
          Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational'} -MaxEvents 5 -ErrorAction SilentlyContinue | Select-Object TimeCreated, Id, Message | Format-List
          Write-Output "=== Application event log — MsiInstaller/AppErrors recent ==="
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2} -MaxEvents 5 -ErrorAction SilentlyContinue | Select-Object TimeCreated, ProviderName, Id, Message | Format-List

          if (-not $found) {
            "INSTALL_DIAG_FAIL first_exit=$($proc.ExitCode) elapsed=${elapsed}s" | Out-File install-diag.log
            throw "installed exe not found at $exe after 90s polling (installer first-process exit=$($proc.ExitCode))"
          }
          Write-Output "exe confirmed: $exe size=$((Get-Item $exe).Length)"

          # تشغيل GUI أول حقيقي بعد تأكيد وجود التنفيذي فعليًا
          $proc2 = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($proc2.HasExited) { throw "app exited on first GUI launch (code=$($proc2.ExitCode))" }
          $proc2 | Stop-Process -Force
          "GUI_LAUNCH_OK pid=$($proc2.Id)" | Out-File gui-launch.log
          Get-Content gui-launch.log
        shell: pwsh

      - name: Smoke WRITE — تفعيل + منتج + بيع كامل داخل التطبيق المُثبَّت
        id: smoke_write
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\RAFD\RAFD.exe"
          Get-Process RAFD -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $proc = Start-Process -FilePath $exe -ArgumentList '--rafd-smoke' -PassThru -Wait -RedirectStandardOutput smoke-write-stdout.log
          Write-Output "exit code: $($proc.ExitCode)"
          Get-Content smoke-write-stdout.log -ErrorAction SilentlyContinue
          $marker = Get-Content "$env:APPDATA\RAFD\smoke-result.txt" -ErrorAction SilentlyContinue
          Write-Output "marker: $marker"
          if ($proc.ExitCode -ne 0 -or $marker -notmatch 'SMOKE_WRITE_OK') { throw "smoke write failed (exit $($proc.ExitCode), marker=$marker)" }
          Copy-Item "$env:APPDATA\RAFD\smoke-state.json" smoke-state.json -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Smoke VERIFY — إعادة تشغيل والتحقق من ثبات البيانات (معيار نجاح المرحلة 0)
        id: smoke_verify
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\RAFD\RAFD.exe"
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $proc = Start-Process -FilePath $exe -ArgumentList '--rafd-smoke-verify' -PassThru -Wait -RedirectStandardOutput smoke-verify-stdout.log
          Write-Output "exit code: $($proc.ExitCode)"
          Get-Content smoke-verify-stdout.log -ErrorAction SilentlyContinue
          $marker = Get-Content "$env:APPDATA\RAFD\smoke-result.txt" -ErrorAction SilentlyContinue
          Write-Output "marker: $marker"
          if ($proc.ExitCode -ne 0 -or $marker -notmatch 'SMOKE_VERIFY_OK') { throw "smoke verify failed (exit $($proc.ExitCode), marker=$marker)" }
        shell: pwsh

      - name: Cross-check مستقل — قراءة قاعدة SQLite من عملية Node منفصلة
        id: cross_verify
        run: |
          node scripts/verify-db.mjs --dir "$env:APPDATA\RAFD"
          if ($LASTEXITCODE -ne 0) { throw "cross verification failed" }
        shell: pwsh

      - name: Artifact metadata (sha256 + size bytes)
        run: |
          $installer = Get-ChildItem dist\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $size = $installer.Length
          $meta = "file=$($installer.Name)`nsha256=$hash`nsize_bytes=$size"
          $meta | Out-File artifact-meta.txt -Encoding utf8
          "### نتيجة البناء" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- file: ``$($installer.Name)``" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- sha256: ``$hash``" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "- size_bytes: ``$size``" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Get-Content artifact-meta.txt
        shell: pwsh
        if: success()

      - name: Upload installer + logs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rafd-setup-windows
          path: |
            dist/*.exe
            artifact-meta.txt
            *-stdout.log
            smoke-state.json
            install-diag.log
            gui-launch.log
          if-no-files-found: warn

      - name: Write CI status to repo (ci-status/LATEST.md)
        if: always()
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path ci-status | Out-Null
          $status = @"
          # آخر نتيجة CI — windows-latest

          - run_id: $($env:GITHUB_RUN_ID)
          - run_attempt: $($env:GITHUB_RUN_ATTEMPT)
          - run_url: $($env:GITHUB_SERVER_URL)/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:GITHUB_RUN_ID)
          - commit: $($env:GITHUB_SHA)
          - job_status: ${{ job.status }}
          - finished_utc: $(Get-Date -Format 'o')
          "@
          if (Test-Path artifact-meta.txt) { $status += "`n## artifact`n" + (Get-Content artifact-meta.txt -Raw) }
          if (Test-Path install-diag.log) { $status += "`n## install diag`n``````" + "`n" + ((Get-Content install-diag.log) -join "`n") + "`n``````" }
          if (Test-Path smoke-write-stdout.log) { $status += "`n## smoke write tail`n``````" + "`n" + ((Get-Content smoke-write-stdout.log -Tail 5) -join "`n") + "`n``````" }
          if (Test-Path smoke-verify-stdout.log) { $status += "`n## smoke verify tail`n``````" + "`n" + ((Get-Content smoke-verify-stdout.log -Tail 5) -join "`n") + "`n``````" }
          $status | Out-File ci-status/LATEST.md -Encoding utf8
          Get-Content ci-status/LATEST.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci-status/LATEST.md
          git commit -m "ci status: ${{ job.status }} [skip ci]"
          git push
